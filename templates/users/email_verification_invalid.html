{% extends "users/basic.html" %}
{% block title %}Invalid Verification Link - BookMySeat{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-4 text-center p-4">
        <div class="card-body">
          <div class="mb-4">
            <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
          </div>
          <h2 class="fw-bold text-dark mb-3">Invalid or Expired Link</h2>
          <p class="text-muted mb-4">
            The email verification link is invalid, has expired, or has already been used.
          </p>
          <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'register' %}" class="btn btn-primary px-4 fw-bold rounded-pill">
              <i class="fas fa-user-plus me-1"></i> Register Again
            </a>
            <a href="{% url 'login' %}" class="btn btn-outline-secondary px-4 fw-bold rounded-pill">
              <i class="fas fa-sign-in-alt me-1"></i> Go to Login
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
